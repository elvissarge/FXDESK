[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxdesk"
version = "0.1.0"
description = "Forex/CFD research, backtesting, signal and paper-trading toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fxdesk" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "PyYAML>=6.0",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
yahoo = ["yfinance>=0.2.40"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
fxdesk = "fxdesk.cli:main"

[tool.setuptools.packages.find]
include = ["fxdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
